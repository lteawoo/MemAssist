[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memassist"
version = "0.1.0"
description = "Project-local memory RAG and trace helper for AI coding agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memassist = "memassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
